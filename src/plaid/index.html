<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plaid Connect</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f9fc;
      color: #111827;
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(17, 24, 39, 0.08);
      text-align: center;
      width: min(420px, calc(100% - 32px));
    }
    button {
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      background: #0a66ff;
      color: #fff;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      color: #374151;
      font-size: 14px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Connect to Plaid</h1>
    <button id="connectBtn" type="button">Connect Bank</button>
    <div id="status">Ready.</div>
  </div>

  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <script>
    const connectBtn = document.getElementById('connectBtn');
    const statusEl = document.getElementById('status');

    const setStatus = (msg) => { statusEl.textContent = msg; };

    connectBtn.addEventListener('click', async () => {
      connectBtn.disabled = true;
      setStatus('Requesting link token...');

      try {
        const tokenRes = await fetch('/api/create_link_token', { method: 'POST' });
        const tokenJson = await tokenRes.json();
        const linkToken = tokenJson.link_token;
        if (!linkToken) throw new Error('No link_token returned from backend.');

        const handler = Plaid.create({
          token: linkToken,
          onSuccess: async (public_token) => {
            setStatus('Exchanging token...');
            const exchangeRes = await fetch('/api/exchange_public_token', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ public_token })
            });
            const exchangeJson = await exchangeRes.json();
            if (!exchangeRes.ok) {
              throw new Error(exchangeJson.error || 'Token exchange failed.');
            }
            setStatus(`Connected. Item ID: ${exchangeJson.item_id}`);
            connectBtn.disabled = false;
          },
          onExit: () => {
            setStatus('Plaid Link closed.');
            connectBtn.disabled = false;
          }
        });

        handler.open();
      } catch (err) {
        setStatus(`Error: ${err.message}`);
        connectBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
