[project]
name = "ergonosis-extraction"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "beautifulsoup4==4.15.0",
    "cryptography==50.0.2",
    "flask==3.1.3",
    "flask-cors==6.0.5",
    "flask-limiter==4.1.1",
    "flask-migrate==4.1.0",
    "flask-session==0.8.0",
    "flask-sqlalchemy==3.1.1",
    "google-cloud-secret-manager==2.31.0",
    "gunicorn==26.2.0",
    "lxml==6.1.3",
    "msal==1.39.0",
    "plaid-python==46.0.0",
    "psycopg[binary]==3.3.6",
    "python-dotenv==1.2.4",
    "redis==8.1.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "ruff~=0.17",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    # "sys_platform == 'win32' and platform_machine == 'x86_64'",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov"

[tool.coverage.run]
source = ["src"]
patch = ["subprocess"]
